name: Update Dex dependencies

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-dex-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      UPDATE_BRANCH: automation/update-dex-dependencies
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Resolve latest stable Dex releases
        id: releases
        shell: bash
        run: |
          sdk_version="$(go list -m -f '{{.Version}}' github.com/superdurable/dex/sdk-go@latest)"
          dex_tags="$RUNNER_TEMP/dex-tags.txt"
          gh api --paginate repos/superdurable/dex/tags --jq '.[].name' > "$dex_tags"
          server_tag="$(grep -E '^server/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' "$dex_tags" | sort -V | tail -1)"
          cli_tag="$(grep -E '^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' "$dex_tags" | sort -V | tail -1)"
          if [[ ! "$sdk_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Dex Go SDK did not return a stable semantic version: $sdk_version" >&2
            exit 1
          fi
          if [[ ! "$server_tag" =~ ^server/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Dex Server did not return a stable release tag: $server_tag" >&2
            exit 1
          fi
          if [[ ! "$cli_tag" =~ ^cli-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Dex CLI did not return a stable release tag: $cli_tag" >&2
            exit 1
          fi
          {
            echo "sdk_version=$sdk_version"
            echo "server_tag=$server_tag"
            echo "cli_tag=$cli_tag"
          } >> "$GITHUB_OUTPUT"
      - name: Update pinned dependencies
        id: update
        env:
          SDK_VERSION: ${{ steps.releases.outputs.sdk_version }}
          SERVER_TAG: ${{ steps.releases.outputs.server_tag }}
          CLI_TAG: ${{ steps.releases.outputs.cli_tag }}
        run: |
          python3 scripts/update-dex-dependencies.py \
            --sdk-version "${SDK_VERSION}" \
            --server-tag "${SERVER_TAG}" \
            --cli-tag "${CLI_TAG}"
      - name: Refresh locks and validate the template contract
        if: steps.update.outputs.changed == 'true'
        run: |
          go mod tidy
          git add \
            .superverse/template.json \
            DEX_CLI_BASELINE \
            DEX_SERVER_BASELINE \
            README.md \
            go.mod \
            go.sum \
            internal/templatecontract/contract_test.go
          git diff --cached --check
          go test ./internal/templatecontract
      - name: Create or update dependency pull request
        if: steps.update.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_sha="$(git ls-remote --heads origin "$UPDATE_BRANCH" | awk '{print $1}')"
          if [[ -n "$remote_sha" ]]; then
            git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH"
          fi
          git switch -C "$UPDATE_BRANCH"
          git commit -m "chore: update Dex dependencies"
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/$UPDATE_BRANCH:$remote_sha" \
              origin "HEAD:refs/heads/$UPDATE_BRANCH"
          else
            git push --set-upstream origin "$UPDATE_BRANCH"
          fi

          body_file="$RUNNER_TEMP/dex-dependency-update.md"
          {
            echo "## Summary"
            echo
            echo "- Dex Go SDK: ${{ steps.update.outputs.sdk_previous }} → ${{ steps.update.outputs.sdk_latest }}"
            echo "- Dex Server: ${{ steps.update.outputs.server_previous }} → ${{ steps.update.outputs.server_latest }}"
            echo "- Dex CLI: ${{ steps.update.outputs.cli_previous }} → ${{ steps.update.outputs.cli_latest }}"
            echo "- Template contract: ${{ steps.update.outputs.template_previous }} → ${{ steps.update.outputs.template_latest }}"
            echo
            echo "This PR was generated by the scheduled Dex dependency updater."
            echo "Template CI was dispatched explicitly because pull requests created with the repository token do not trigger pull_request workflows."
          } > "$body_file"

          pr_number="$(gh pr list --state open --head "$UPDATE_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --title "Update Dex dependencies" \
              --body-file "$body_file"
          else
            gh pr create \
              --base main \
              --head "$UPDATE_BRANCH" \
              --title "Update Dex dependencies" \
              --body-file "$body_file"
          fi
          gh workflow run ci.yml --ref "$UPDATE_BRANCH"
